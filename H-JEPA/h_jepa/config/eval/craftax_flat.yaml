# Craftax-Classic: flat level-1 planning (LeWM) with categorical CEM.
# Sample counts are placeholders until the planner compute is timed.
# Two steps: run once with `policy=random dump_eval_trajs_path=<file>` to sample
# tasks from eval.dataset_name, then set load_eval_trajs_path=<file> for the
# planning runs.
cache_dir: ${oc.env:HJEPA_HOME}
world:
  env_name: swm/CraftaxClassic-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  history_size: 1
  frame_skip: 1
dataset:
  stats: craftax_expert_train
  keys_to_cache:
  - action
  level1:
    frameskip: 1
    num_steps: 1
seed: 42
policy: null
dump_eval_trajs_path: null
load_eval_trajs_path: null
solver:
  _target_: stable_worldmodel.solver.CategoricalCEMSolver
  model: ???
  num_samples: 300
  n_iters: 10
  topk: 30
  batch_size: 5
  device: cuda
  seed: ${seed}
plan_config:
  horizon: 10
  receding_horizon: 5
  action_block: 1
  cost_last_n: 1
planning_metrics:  # what the planner did and whether to trust it, see planning_metrics.py
  enabled: true
  diag_every: 1  # plan diagnostics (open-loop replay in the simulator) every k-th replanning, 0 = off
  rank_candidates: 8  # chosen + random + perturbed plans compared per diagnostic
  support_bank_dataset: craftax_expert_train  # dataset for the support metric, null = off
  support_bank_frames: 4096
eval:
  num_eval: 50
  goal_offset_steps: 50  # open decision, together with the goal test
  eval_budget: 100
  img_size: 63
  dataset_name: craftax_expert_val
  chunk_size: null  # chunked, resumable eval needs load_eval_trajs_path
  callables:
  - method: _set_state
    args:
      full_state:
        value: full_state
  - method: _set_goal_state
    args:
      full_state:
        value: goal_full_state
output:
  dir: null
