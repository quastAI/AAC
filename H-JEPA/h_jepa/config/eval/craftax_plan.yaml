# Craftax-Classic planning for a model of any depth (1 to 4 levels, H-JEPA and HWM): the blocks of the
# levels above the model are dropped when it is loaded. CEM over discrete actions at level 1 and over
# VQ codes above. Sample counts and horizons are placeholders.
# Horizons: the top level plans `horizon` steps of its own. A level below follows the plan of the one
# above and plans exactly one upper step, so its horizon is the stride of the level above (the value
# under `horizon` is ignored for it). Level 1 alone (the flat model) plans its own horizon 10.
# Tasks: see eval_tasks.py (protocols A and B).
cache_dir: ${oc.env:HJEPA_HOME}
world:
  env_name: swm/CraftaxClassic-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  history_size: 1
  frame_skip: 1
dataset:
  stats: craftax_expert_train
  keys_to_cache:
  - action
  level1:
    frameskip: 1
    num_steps: 1
seed: 42
policy: null
dump_eval_trajs_path: null
load_eval_trajs_path: null
solver:
  _target_: hierarchical_solver.HierarchicalSolver
  solvers:
    level1:
      _target_: stable_worldmodel.solver.CategoricalCEMSolver
      num_samples: 300
      n_iters: 10
      topk: 30
      batch_size: 5
      device: cuda
      seed: ${seed}
    level2:
      _target_: stable_worldmodel.solver.CategoricalCEMSolver
      num_samples: 300
      n_iters: 10
      topk: 30
      batch_size: 5
      device: cuda
      seed: ${seed}
      proposal_fraction: 0.5  # share of the samples that are code sequences of the data (planning_proposals)
    level3:
      _target_: stable_worldmodel.solver.CategoricalCEMSolver
      num_samples: 300
      n_iters: 10
      topk: 30
      batch_size: 5
      device: cuda
      seed: ${seed}
      proposal_fraction: 0.5  # share of the samples that are code sequences of the data (planning_proposals)
    level4:
      _target_: stable_worldmodel.solver.CategoricalCEMSolver
      num_samples: 300
      n_iters: 10
      topk: 30
      batch_size: 5
      device: cuda
      seed: ${seed}
      proposal_fraction: 0.5  # share of the samples that are code sequences of the data (planning_proposals)
hierarchical_plan_config:
  receding_horizon: 2
  level1:
    horizon: 10  # only used when level 1 is the top level (the flat model)
    horizon_schedule: fixed
    action_block: 1
    cost_last_n: 1
    action_cost_weight: 0.0
  level2:
    horizon: 4
    horizon_schedule: fixed
    action_block: 1
    cost_last_n: 1
  level3:
    horizon: 4
    horizon_schedule: fixed
    action_block: 1
    cost_last_n: 1
  level4:
    horizon: 4
    horizon_schedule: fixed
    action_block: 1
    cost_last_n: 1
planning_proposals:  # whole code sequences of the training data, mixed into the upper-level CEM (code_bank.py)
  dataset: craftax_expert_train  # null = the upper levels search all code combinations uniformly
  clips: 512  # clips encoded to collect the sequences
  exclude_sources: [2]  # uniform random episodes
  num_actions: 17
planning_metrics:  # what the planner did and whether to trust it, see planning_metrics.py
  enabled: true
  diag_every: 1  # plan diagnostics (open-loop replay in the simulator) every k-th replanning, 0 = off
  rank_candidates: 8  # chosen + random + perturbed plans compared per diagnostic
  support_bank_dataset: craftax_expert_train  # dataset for the support metric, null = off
  support_bank_frames: 4096
eval:
  num_eval: 50
  goal_offset_steps: 50  # open decision, together with the goal test
  eval_budget: 100
  img_size: 63
  dataset_name: craftax_expert_val
  chunk_size: null  # chunked, resumable eval needs load_eval_trajs_path
  callables:
  - method: _set_state
    args:
      full_state:
        value: full_state
  - method: _set_goal_state
    args:
      full_state:
        value: goal_full_state
output:
  dir: null
