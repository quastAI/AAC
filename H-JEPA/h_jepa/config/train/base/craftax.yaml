# @package _global_
# Craftax-Classic: settings shared by all models. Frames are 63x63 and enter the
# ViT natively (patch 7 = one tile), actions are the 17 discrete Craftax actions
# fed as one-hot vectors. Hyperparameters are the Push-T ones until timed on Craftax.
data:
  dataset:
    name: craftax_expert_train
    val_name: craftax_expert_val
    keys_to_load:
    - pixels
    - action
    - source  # 0 expert, 1 noised expert, 2 uniform random (not z-scored)
    keys_to_cache:
    - action
    # Episodes that ended in death are extended by copies of their last (dead) frame, so that every level
    # sees the death on its step grid ("auto": one top-level step minus one frame; 0 = off).
    terminal_pad: auto
    level1:
      frameskip: 1  # open decision: 1 env step per level-1 step
      num_steps: ${eval:'${level1.wm.history_size} + ${level1.wm.rollout_n}'}
quick_debug: false
# Episode sources whose clips train level 1 only (the levels above skip them): uniform random
# episodes (an optional fallback in the data plan) are noise as chunks of actions. Early-checkpoint and noised-expert
# episodes (which may die) train every level.
upper_loss_exclude_sources: [2]
output_model_name: model
env: craftax
subdir: ${env}/${output_model_name}/seed${seed}
hydra:  # Hydra logs inside the run dir (main_hjepa.py run_dir), not in the launch dir
  run:
    dir: ${oc.env:HJEPA_HOME,${oc.env:HOME}/.stable_worldmodel}/ckpts/${subdir}/hydra
num_workers: 12
seed: 42
img_size: 63
patch_size: 7
encoder_scale: tiny
dump_object: true
save_every_n_epochs: 1
resume_every_n_steps: 2000  # full-state resume checkpoint (0 = off), see utils.ResumeCheckpoint
grad_clip_per_level: true  # each level clips its own gradient norm (trainer.gradient_clip_val), as in the DROID recipe
trainer:
  max_epochs: 10
  devices: auto
  accelerator: gpu
  precision: bf16-mixed
  gradient_clip_val: 1.0
  num_sanity_val_steps: 1
loader:
  batch_size: 128
  num_workers: ${num_workers}
  drop_last: true
  persistent_workers: true
  prefetch_factor: 8
  pin_memory: true
  shuffle: true
optimizer:
  type: AdamW
  lr: 5.0e-05
  weight_decay: 0.001
wandb:
  enabled: false
  config:
    entity: null
    project: hjepa
    name: null
    id: null
    resume: allow
    log_model: false
planning_eval:
  enabled: true
  config_name: ???
  output_subdir: planning_eval
  run_on_train_end: true
  every_n_epochs: 0  # also run the planning eval every N epochs (0 = end of training only)
final_probing_decoding_eval:
  enabled: false  # needs a craftax probing config
  config_name: ???
  output_subdir: final_probing_decoding_eval
health:  # collapse and failure monitor, see health.py and training_monitor.py
  enabled: true
  live_every: 50  # steps between live metrics from the training batch
  warmup_steps: 200  # no findings before this step (the predictor starts as a copy)
  epoch_batches: 8  # validation batches per epoch evaluation
  final_batches: 32  # ... at the end of training
  long_clip_frames: 129  # level-1 frames per validation clip (drift, cost geometry)
  clip_batch_size: 16
  max_clips: 512
  drift_horizon: 8  # open-loop rollout steps per level
  plan_history: 1  # context frames the planner uses in its rollouts
  stop_after_critical_epochs: 0  # stop after this many epochs with a critical finding (0 = never)
  probe_at_end: true  # probe every level on held-out worlds when training ends (probe_eval.py)
  probe_clips: 256
  thresholds: {}  # overrides of health.Thresholds
level1:
  lr: 5.0e-05
  idm_coeff: 0.1  # cross-entropy on the action(s) of each step (set per model)
  idm:
    hidden_dim: 256
  wm:
    history_size: 3
    rollout_n: 1
    rollout_loss_weight: 1.0
    embed_dim: 192
    use_proprio: false
    num_actions: 17  # discrete actions, one-hot encoded (see data.OneHotColumn)
  action_embed:
    type: linear  # one action per step: a lookup table for the one-hot, no conv and no hidden layer
  encoder:
    type: vit
    scale: ${encoder_scale}
    projector:
      type: mlp
  predictor:
    depth: 4
    heads: 8
    mlp_dim: 1024
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
    hidden_dim: 192
    projector:
      type: mlp
  loss:
    embed:
      sigreg:
        enabled: true
        weight: 0.09
