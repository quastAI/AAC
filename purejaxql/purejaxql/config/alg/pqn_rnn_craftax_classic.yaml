# PQN-RNN expert for Craftax-Classic (symbolic observations).
# Same hyperparameters as pqn_rnn_craftax.yaml; only the env-specific block differs.
# Train:    python purejaxql/pqn_rnn_craftax.py +alg=pqn_rnn_craftax_classic
# Collect:  python scripts/collect_craftax_episodes.py --checkpoint models/Craftax-Classic-Symbolic-v1/<name>_vmap0.safetensors ...
ALG_NAME: "pqn_rnn"
TOTAL_TIMESTEPS: 1e9 # to be sized from a timed run
TOTAL_TIMESTEPS_DECAY: 1e9 # will be used for decay functions, in case you want to test for less timesteps and keep decays same
NUM_ENVS: 1024 # parallel environments
MEMORY_WINDOW: 0 # steps of previous episode added in the rnn training horizon
NUM_STEPS: 128 # steps per environment in each update
EPS_START: 1.
EPS_FINISH: 0.005
EPS_DECAY: 0.1 # ratio of total updates
NUM_MINIBATCHES: 4 # minibatches per epoch
NUM_EPOCHS: 4 # minibatches per epoch
NORM_INPUT: True
NORM_TYPE: "layer_norm" # layer_norm or batch_norm
HIDDEN_SIZE: 512
NUM_LAYERS: 1
NUM_RNN_LAYERS: 1
ADD_LAST_ACTION: True # adds last action to the input of the rnn
LR: 0.0003
MAX_GRAD_NORM: 0.5
LR_LINEAR_DECAY: True
REW_SCALE: 1.
GAMMA: 0.99
LAMBDA: 0.5

# env specific
ENV_NAME: "Craftax-Classic-Symbolic-v1"
USE_OPTIMISTIC_RESETS: True
OPTIMISTIC_RESET_RATIO: 16
LOG_ACHIEVEMENTS: True # per-achievement success rates; diamond is Achievements/collect_diamond

# evaluation
TEST_DURING_TRAINING: True # greedy rollouts to track the diamond rate (only visible with WANDB_MODE=online)
TEST_INTERVAL: 0.05 # in terms of total updates (20 evals, ~5% extra env steps)
TEST_NUM_ENVS: 256
TEST_NUM_STEPS: 10000 # = Craftax-Classic max episode length
EPS_TEST: 0.00 # 0 for greedy policy
# experiment params
NUM_SEEDS: 1
SEED: 0

# if  hyperparameters tuning
HYP_TUNE: False

# wandb params
WANDB_MODE: "disabled"  # set to online to activate wandb
ENTITY: ""
PROJECT: ""
alg:
  WANDB_LOG_ALL_SEEDS: False # will log all the vmapped seeds separetely

# where to save the params (if None, will not save)
SAVE_PATH: "./models"

# intermediate checkpoints (need SAVE_PATH). Every CHECKPOINT_INTERVAL x the total updates (0 = only at the
# end) the run saves a policy snapshot with its greedy-test metrics (<name>_vmap0_u<updates>.safetensors
# and .json) and the full resumable state (<name>_state.safetensors). RESUME: true continues from that
# state after a kill; it needs the same training configuration. Pick the expert from the .json files.
CHECKPOINT_INTERVAL: 0.05 # = TEST_INTERVAL, so every snapshot holds fresh test metrics
RESUME: False
