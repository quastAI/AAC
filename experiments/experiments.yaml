# The Craftax jobs: the data plan (D1), the dataset numbers (D0) and the flat-model phase (README,
# "Current phase"). `run.py` turns this into commands.
#
# A run trains `config` as `name` (unless `train: false` and `model` names an existing run),
# then is evaluated with the evaluation config `eval` on the task sets of the experiment's
# protocols. Overrides are Hydra overrides of the training config. Seeds come from the
# command line (exploration: one seed; headline results: three). `probe` lists runs to probe
# (after their training if it is in the same experiment); `planner_scale` on a run multiplies the
# planner's samples x iterations, and `compare: scaling` compares such runs by compute.
#
# Everything marked placeholder is to be set from the data analysis and the first runs.

settings:
  seeds_explore: [42]
  seeds_final: [42, 43, 44]
  train_dataset: craftax_expert_train  # placeholder names of the collector's output
  val_dataset: craftax_expert_val  # exploration: tasks come from here
  test_dataset: craftax_expert_test  # headline results (--final): tasks come from here
  tasks_dir: eval_tasks  # under $HJEPA_HOME
  chunk_size: 10  # evaluation tasks per resumable chunk

# Data collection (D1): the final expert's episodes that reach the diamond (source 0, the tasks come from
# them) and rollouts of earlier snapshots of the expert's training (source `early`, from the snapshots given
# with --early-checkpoint, which may die; they train every level). The mix is counted in frames (what the clip
# sampler sees; episodes differ a lot in length): every run stops at its share of the split's frames, and the
# early share is split equally among the snapshots. Seeds are the split: disjoint ranges, so validation and
# test worlds are held out; the first 500000 seeds of a range go to the expert, the rest equally to the other
# runs, and every run stops where the next range begins. The test split holds only the final expert (tasks).
# `noised` (epsilon `noise_eps` on the final expert) and `random` (uniform) are optional, default 0: a fallback
# if the dataset section's action coverage shows actions that are not covered. Placeholders: the mix and the snapshots
# are decided after the data exists and its behaviour has been analysed (the dataset section); the frame counts follow the timing run.
collection:
  frames: {train: 2000000, val: 150000, test: 150000}
  share:
    train: {expert: 0.7, early: 0.3}
    val: {expert: 0.7, early: 0.3}
    test: {expert: 1.0}
  noise_eps: 0.3
  seed_start: {train: 0, val: 1000000, test: 2000000}

# Task sets (eval_tasks.py). The budget is in environment steps. Placeholders: the offsets,
# the number of tasks and the budgets follow from the goal-test decision and the timing run.
# A is the cheap set for the flat variants (decided 2026-10-27): offsets 8 and 16 (the probe-readable horizon of
# level 1 is about 8 steps, 16 its edge), 300 tasks (the 95% interval of a success rate is about +-6 points; 100
# tasks give +-10), budget 2x the larger offset. By the README's bound (18 s per task at 400 steps) that is minutes
# per model, to be timed with time_run.py. B and C are for the final flat-against-hierarchy comparison.
tasks:
  A: {mode: offset, offsets: [8, 16], num_tasks: 300, eval_budget: 32}
  B: {mode: episode, num_tasks: 100, eval_budget: 3000}
  # the oracle chain (P2): the tasks of B, the planner's goal switches through the expert's frames every
  # offset, each held subgoal_budget steps (placeholder 2x the offset)
  C: {mode: chain, offsets: [50], subgoal_budget: 100, num_tasks: 100, eval_budget: 3000}

experiments:
  D1:
    title: Data collection (needs the trained expert, --expert-checkpoint)
    collection: true

  D0:
    title: Dataset section numbers (lengths, achievements, change matrix, clip coverage, actions, entity gap; `dataset_section compute`)
    analysis: true

  # The flat-model phase. Every variant runs the cycle: training, probes, planning P1-P3 (protocols A, B and
  # the oracle chain), each with the random baseline. The planning settings (goal offset, horizon, CEM) are
  # set on the F1 model (F2) and then frozen for every variant. Coefficient, delta and CLS/patch variants are
  # added when they are run (README).
  F1:
    title: Default flat model (level 1 alone, IDM on, history 3, rollout_n 1, CLS latent), training and probes
    runs:
      - {name: flat, config: craftax_hjepa, eval: craftax_plan, overrides: [num_levels=1]}
    probe: [flat]  # the training already probes at its end (health.probe_clips): this job only runs if that failed

  F2:
    title: Planning settings (goal offset, planning horizon, CEM) on the F1 model, then frozen for every variant
    blocked: not designed yet (no full sweep; decided once the F1 model exists)

  F3:
    title: P1, planning toward fixed-offset goals (protocol A) with the F1 model
    protocols: [A]
    baseline: true  # a random policy on the same tasks
    runs:
      - {name: flat, train: false, model: flat, eval: craftax_plan}

  F4:
    title: P2, planning to the diamond through oracle subgoals (the expert's frames at multiples of the goal offset)
    protocols: [C]
    baseline: true
    runs:
      - {name: flat, train: false, model: flat, eval: craftax_plan}

  F5:
    title: P3, planning to the diamond from the final goal only (protocol B) with the F1 model
    protocols: [B]
    baseline: true
    runs:
      - {name: flat, train: false, model: flat, eval: craftax_plan}

  V1:
    title: First variants against F1, full runs (the rollout model with history 1, SIGReg weight 0.03); cheap planning (set A)
    protocols: [A]
    baseline: true  # the same jobs as in F3: skipped when done
    runs:
      # F1, the reference: planned on set A (the same jobs as in F3, skipped when done) and in both comparisons
      - {name: flat, train: false, model: flat, eval: craftax_plan}
      # the rollout model: history 1 and a 4-step open-loop loss (the planner rolls out with history 1); F1 settings otherwise
      - {name: flat_h1_rollout4, config: craftax_hjepa, eval: craftax_plan, overrides: [num_levels=1, level1.wm.history_size=1, level1.wm.rollout_n=4]}
      # SIGReg weight 3x lower (0.09 in F1); the health monitor stops a run whose effective rank collapses
      - {name: flat_sigreg003, config: craftax_hjepa, eval: craftax_plan, overrides: [num_levels=1, level1.loss.embed.sigreg.weight=0.03]}
    probe: [flat, flat_h1_rollout4, flat_sigreg003]  # F1's probe job only runs when its report is missing

  A1:
    title: Ablation (not a model candidate), F1 with balanced clip sampling (the rare faced blocks and events drawn more often); cheap planning (set A)
    protocols: [A]
    baseline: true
    runs:
      - {name: flat, train: false, model: flat, eval: craftax_plan}
      # F1 settings (SIGReg 0.09) and one change: the weights of balance.py, from simulator labels a real agent would not have
      - {name: flat_balanced, config: craftax_hjepa, eval: craftax_plan, overrides: [num_levels=1, data.balance.enabled=true]}
    probe: [flat, flat_balanced]
