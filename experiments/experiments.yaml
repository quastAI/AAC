# The Craftax experiments (README table). `run.py` turns this into commands.
#
# A run trains `config` as `name` (unless `train: false` and `model` names an existing run),
# then is evaluated with the evaluation config `eval` on the task sets of the experiment's
# protocols. Overrides are Hydra overrides of the training config. Seeds come from the
# command line (exploration: one seed; headline results: three).
#
# Everything marked placeholder is to be set from the data analysis and the first runs.

settings:
  seeds_explore: [42]
  seeds_final: [42, 43, 44]
  train_dataset: craftax_expert_train  # placeholder names of the collector's output
  val_dataset: craftax_expert_val  # exploration: tasks come from here
  test_dataset: craftax_expert_test  # headline results (--final): tasks come from here
  tasks_dir: eval_tasks  # under $HJEPA_HOME
  chunk_size: 10  # evaluation tasks per resumable chunk

# Data collection (D1): the final expert's episodes that reach the diamond (source 0, the tasks come from
# them) and rollouts of earlier snapshots of the expert's training (source `early`, from the snapshots given
# with --early-checkpoint, which may die; they train every level). The mix is counted in frames (what the clip
# sampler sees; episodes differ a lot in length): every run stops at its share of the split's frames, and the
# early share is split equally among the snapshots. Seeds are the split: disjoint ranges, so validation and
# test worlds are held out; the first 500000 seeds of a range go to the expert, the rest equally to the other
# runs, and every run stops where the next range begins. The test split holds only the final expert (tasks).
# `noised` (epsilon `noise_eps` on the final expert) and `random` (uniform) are optional, default 0: a fallback
# if D0 shows that actions are not covered (the action-coverage table). Placeholders: the mix and the snapshots
# are decided after the data exists and its behaviour has been analysed (D0); the frame counts follow the timing run.
collection:
  frames: {train: 2000000, val: 150000, test: 150000}
  share:
    train: {expert: 0.7, early: 0.3}
    val: {expert: 0.7, early: 0.3}
    test: {expert: 1.0}
  noise_eps: 0.3
  seed_start: {train: 0, val: 1000000, test: 2000000}

# Task sets (eval_tasks.py). The budget is in environment steps. Placeholders: the offsets,
# the number of tasks and the budgets follow from the goal-test decision and the timing run.
tasks:
  A: {mode: offset, offsets: [25, 50, 100, 200], num_tasks: 200, eval_budget: 400}
  B: {mode: episode, num_tasks: 100, eval_budget: 3000}

experiments:
  D1:
    title: Data collection (needs the trained expert, --expert-checkpoint)
    collection: true

  D0:
    title: Data analysis (clip counts, event durations, time scales, chunk diversity)
    analysis: true

  E1:
    title: Level 1 alone (LeWM) vs HWM vs H-JEPA at matched depth (the depth is `num_levels`)
    rq: [1]
    protocols: [A, B]
    baseline: true  # a random policy on the same tasks
    runs:
      - {name: e1_l1, config: craftax_hjepa, eval: craftax_plan, overrides: [num_levels=1]}
      - {name: e1_hwm_l2, config: craftax_hwm, eval: craftax_plan, overrides: [num_levels=2]}
      - {name: e1_hjepa_l2, config: craftax_hjepa, eval: craftax_plan, overrides: [num_levels=2]}

  E2:
    title: Depth, 2 vs 3 levels (set the strides from D0 with --override level2.stride=.. level3.stride=..)
    rq: [1]
    protocols: [A, B]
    baseline: true
    runs:
      - {name: e1_hjepa_l2, train: false, model: e1_hjepa_l2, eval: craftax_plan}
      - {name: e2_hjepa_l3, config: craftax_hjepa, eval: craftax_plan, overrides: [num_levels=3]}
      - {name: e2_hwm_l3, config: craftax_hwm, eval: craftax_plan, overrides: [num_levels=3], optional: true}

  E3:
    title: Rollout loss on/off, set per model (off is the E1 run with rollout_n 1)
    rq: [1, 2]
    protocols: [A]
    baseline: true
    runs:
      - {name: e3_l1_rollout4, config: craftax_hjepa, eval: craftax_plan, overrides: [num_levels=1, level1.wm.rollout_n=4]}
      - name: e3_hjepa_l2_rollout4
        config: craftax_hjepa
        eval: craftax_plan
        overrides: [num_levels=2, level1.wm.rollout_n=4, level2.wm.rollout_n=4]

  E4:
    title: Per-level probes (larger probe sets than the end of training), frequency gap, cost geometry
    rq: [2]
    probe: [e1_l1, e1_hwm_l2, e1_hjepa_l2, e2_hjepa_l3]

  E5:
    title: IDM on/off, set per model (on is the E1 run; level 1 alone first, then H-JEPA, HWM if the budget allows)
    rq: [1, 2]
    protocols: [A]
    baseline: true
    runs:
      - {name: e5_l1_noidm, config: craftax_hjepa, eval: craftax_plan, overrides: [num_levels=1, level1.idm_coeff=0]}
      - name: e5_hjepa_l2_noidm
        config: craftax_hjepa
        eval: craftax_plan
        overrides: [num_levels=2, level1.idm_coeff=0, level2.idm_coeff=0]
      - name: e5_hwm_l2_noidm
        config: craftax_hwm
        eval: craftax_plan
        overrides: [num_levels=2, level1.idm_coeff=0, level2.idm_coeff=0]
        optional: true

  E6:
    title: Cost only, level-1 planning with the cost in the level-2 latent (evaluation of E1 models)
    rq: [1]
    protocols: [A]
    runs:
      - {name: e6_hjepa_l2_project, train: false, model: e1_hjepa_l2, eval: craftax_l2_project}
      - {name: e6_hwm_l2_project, train: false, model: e1_hwm_l2, eval: craftax_l2_project}

  E7:
    title: Variable band vs fixed stride, including the band width
    rq: [3]
    blocked: the irregular-spacing dataset sampler, passing action_duration through the hierarchical encode and the hierarchical solver's fixed-stride horizon coupling are not built

  E8:
    title: Learned jumps vs fixed vs band
    rq: [4]
    blocked: learned jumps are not built

  C1:
    title: Planner compute scaling of the E1 H-JEPA model (success or progress falling with compute means exploitation)
    protocols: [A]
    runs:
      - {name: c1_x0.25, train: false, model: e1_hjepa_l2, eval: craftax_plan, planner_scale: 0.25}
      - {name: c1_x1, train: false, model: e1_hjepa_l2, eval: craftax_plan, planner_scale: 1}
      - {name: c1_x4, train: false, model: e1_hjepa_l2, eval: craftax_plan, planner_scale: 4}
